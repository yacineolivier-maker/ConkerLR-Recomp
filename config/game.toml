# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]
CDevice_KickOff = ["edx"]  # reads edx, pops 0
D3DDevice_DrawVertices = ["stack", "ecx", "eax"]  # reads eax ecx, pops 4
D3DDevice_GetVertexShaderFunction = ["edx", "eax", "ecx"]  # reads eax ecx edx, pops 0
D3DDevice_SelectVertexShader = ["eax", "ebx"]  # reads eax ebx, pops 0
D3DDevice_SetIndices = ["ebx", "stack"]  # reads ebx, pops 4
D3DDevice_SetPixelShader = ["eax"]  # reads eax, pops 0
D3DDevice_SetPixelShaderConstant = ["ecx", "stack", "eax"]  # reads eax ecx, pops 4
D3DDevice_SetShaderConstantMode = ["eax"]  # reads eax, pops 0
D3DDevice_SetStreamSource = ["eax", "ebx", "stack"]  # reads eax ebx, pops 4
D3DDevice_SetTexture = ["eax", "stack"]  # reads eax, pops 4
D3DDevice_SetTextureState_TexCoordIndex = ["esi", "stack"]  # reads esi, pops 4
D3DDevice_SetTransform = ["eax", "edx"]  # reads eax edx, pops 0
D3DDevice_Swap = ["eax"]  # reads eax, pops 0
D3DResource_IsBusy = ["ecx"]  # reads ecx, pops 0
D3D_InternalRelease = ["esi"]  # reads esi, pops 0
D3D_MakeRequestedSpace = ["stack", "eax"]  # reads eax, pops 4
D3DDevice_Reset = ["ebx"]  # 0x2A79B6 : lea ebx, [esp+0xC] ; pops 0
Direct3D_CreateDevice = ["none", "none", "none", "eax", "stack", "ecx"]  # reads eax ecx, pops 4

# diagnostic (src/game/diag_hooks.cpp)

[[hook]]
at = 0x252F9A
call = "MarkVideoFrame"  # src/game/video.cpp

[[hook]]
at = 0x3F35DB
call = "LogFixupEnd"

[[hook]]
at = 0x18B30
call = "GameTrace"  # src/game/diag_hooks.cpp : XBE_TRACE_JEU

[[hook]]
at = 0x2A9442
call = "ForceLevel"  # src/game/diag_hooks.cpp : test XBE_NIVEAU

# instantanés (src/game/instantanes.cpp) : lecture des manettes, après les XInputGetState, une fois par image
[[hook]]
at = 0x3D1B16
call = "Instantanes"
